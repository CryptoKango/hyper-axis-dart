name: CI

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: example
      - name: Verify Rust libraries in APK
        run: |
          unzip -l example/build/app/outputs/flutter-apk/app-debug.apk \
            | grep 'lib/arm64-v8a/libhyper_axis_ffi.so'
          unzip -l example/build/app/outputs/flutter-apk/app-debug.apk \
            | grep 'lib/armeabi-v7a/libhyper_axis_ffi.so'
          unzip -l example/build/app/outputs/flutter-apk/app-debug.apk \
            | grep 'lib/x86_64/libhyper_axis_ffi.so'

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: flutter pub get
      - run: flutter build ios --simulator --no-codesign
        working-directory: example
      - name: Verify Rust framework in app bundle
        run: >-
          test -f
          example/build/ios/iphonesimulator/Runner.app/Frameworks/hyper_axis_ffi.framework/hyper_axis_ffi
